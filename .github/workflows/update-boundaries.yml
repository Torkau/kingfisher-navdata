name: Update IVAO Sector Boundaries

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Neueste IVAO-Datei pruefen und bauen
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pip install --quiet shapely
          python3 - <<'PY'
          import urllib.request, re, json, os, subprocess
          force = os.environ.get("EVENT") == "workflow_dispatch"
          base = "https://www.littlenavmap.org/downloads/Airspace%20Boundaries/"
          req = urllib.request.Request(base, headers={"User-Agent": "kingfisher-navdata-bot"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          dates = sorted(set(re.findall(r'IVAO(?:%20| )ATC(?:%20| )Positions(?:%20| )(\d{8})\.zip', html)))
          if not dates:
              print("Keine IVAO-Datei im Listing gefunden, Abbruch.")
              raise SystemExit(0)
          latest = dates[-1]
          try:
              cur = json.load(open("version.json")).get("boundaries", "")
          except Exception:
              cur = ""
          mcur = re.match(r"\d{8}", cur or "")
          curd = mcur.group(0) if mcur else ""
          print("Neueste:", latest, "| aktuell (Datum):", curd or "(keine)", "| force:", force)
          if (not force) and latest <= curd:
              print("Bereits aktuell, nichts zu tun.")
              raise SystemExit(0)
          url = base + "IVAO%20ATC%20Positions%20" + latest + ".zip"
          print("Lade", url)
          urllib.request.urlretrieve(url, "ivao.zip")
          subprocess.check_call(["python3", "build_boundaries.py", "ivao.zip", "."])
          os.remove("ivao.zip")
          print("Neu gebaut fuer", latest)
          PY

      - name: Aenderungen committen
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "boundaries-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sector_boundaries.js version.json
            git commit -m "Auto: IVAO Sector Boundaries aktualisiert (Union)"
            git push
            echo "Aktualisiert und committet."
          else
            echo "Keine Aenderung."
          fi
